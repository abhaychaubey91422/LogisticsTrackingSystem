# Production + Local dono ke liye
spring.application.name=LogisticsTrackingSystem
server.port=${PORT:8080}

# Database - Railway MySQL ke liye (baad mein update karenge)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/logistics_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false