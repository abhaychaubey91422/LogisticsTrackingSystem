<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Tracking</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>📍 Add Tracking Update</h1>
        <h3>Shipment ID: <span th:text="${shipmentId}"></span></h3>
        
        <form action="/addTracking" method="post">
            <input type="hidden" name="shipmentId" th:value="${shipmentId}">
            
            <label>Location:</label>
            <input type="text" name="location" required><br>
            
            <label>Status:</label>
            <select name="status">
                <option value="PICKED_UP">PICKED_UP</option>
                <option value="IN_TRANSIT">IN_TRANSIT</option>
                <option value="OUT_FOR_DELIVERY">OUT_FOR_DELIVERY</option>
                <option value="DELIVERED">DELIVERED</option>
            </select><br>
            
            <label>Remarks:</label>
            <textarea name="remarks"></textarea><br>
            
            <button type="submit">Add Tracking</button>
        </form>
        
        <br>
        <a href="/dashboard">← Back to Dashboard</a>
    </div>
</body>
</html>
