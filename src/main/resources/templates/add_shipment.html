<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Shipment</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>➕ Add New Shipment</h1>
        
        <form action="/addShipment" method="post">
            <label>Shipment ID:</label>
            <input type="text" name="shipmentId" required><br>
            
            <label>Customer Name:</label>
            <input type="text" name="customerName" required><br>
            
            <label>Origin:</label>
            <input type="text" name="origin" required><br>
            
            <label>Destination:</label>
            <input type="text" name="destination" required><br>
            
            <button type="submit">Add Shipment</button>
        </form>
        
        <br>
        <a href="/dashboard">← Back to Dashboard</a>
    </div>
</body>
</html>
